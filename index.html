<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="expande tus preferencias mas alla de tu zona de confort"
    />
    <meta name="robots" content="index,follow" />
    <title>Game Recommender</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="estilo/estilo.css" />
    <script src="app.js" defer></script>

    <header>
      <h1 id="titulo">Game Recomender</h1>

        <div class="personajes">
          <img src="estilo/assets/nero.png" alt="Nero" />

          <img src="estilo/assets/wukong.png" alt="Wukong" />
          <img src="estilo/assets/spiderman.png" alt="Spider-Man" />
        </div>
      </section>
      <button id="boton-inicio" class="boton-test">descubre</button>
      <section
        id="opciones-test"
        aria-label="Opciones para iniciar el test"
      ></section>
    </main>
